# Сборка и публикация релиза по тегу вида v3.0.0
# git tag v3.0.0 && git push origin v3.0.0
#
# Необязательные настройки репозитория (Settings → Secrets and variables → Actions):
#   секрет     UPDATE_SIGNING_KEY — приватный ключ подписи обновлений (PEM), см. tools/new-signing-key.ps1
#   переменная UPDATE_PUBLIC_KEY  — публичный ключ (одна строка base64), вшивается в exe
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # нужно, чтобы создать релиз и загрузить файлы

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Версия из тега
        id: ver
        shell: pwsh
        run: |
          $v = "$env:GITHUB_REF_NAME".TrimStart('v')
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Тег должен быть вида v1.2.3, а не $env:GITHUB_REF_NAME" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Тесты
        run: dotnet test Undertone.Tests/Undertone.Tests.csproj -c Release --nologo

      # self-contained: у пользователя не нужно ставить .NET — всё внутри одного exe
      - name: Publish
        shell: pwsh
        env:
          UPDATE_PUBLIC_KEY: ${{ vars.UPDATE_PUBLIC_KEY }}
        run: |
          $publishArgs = @(
            'publish', 'Undertone/Undertone.csproj', '-c', 'Release', '-r', 'win-x64', '--self-contained', 'true',
            '-p:PublishSingleFile=true', '-p:IncludeNativeLibrariesForSelfExtract=true', '-p:EnableCompressionInSingleFile=true',
            '-p:DebugType=none', "-p:Version=${{ steps.ver.outputs.version }}", "-p:UpdateRepo=${{ github.repository }}",
            '-o', 'publish')
          if ($env:UPDATE_PUBLIC_KEY) { $publishArgs += "-p:UpdatePublicKey=$($env:UPDATE_PUBLIC_KEY.Trim())" }
          & dotnet @publishArgs
          if ($LASTEXITCODE -ne 0) { throw 'dotnet publish упал' }

      - name: Архив и контрольная сумма
        shell: pwsh
        run: |
          Compress-Archive -Path publish\* -DestinationPath Undertone-win-x64.zip
          $hash = (Get-FileHash Undertone-win-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  Undertone-win-x64.zip" | Set-Content -Encoding ascii Undertone-win-x64.zip.sha256

      - name: Подпись обновления
        shell: pwsh
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if (-not $env:UPDATE_SIGNING_KEY) { Write-Host 'Ключа подписи нет — релиз без .sig'; exit 0 }
          $ecdsa = [System.Security.Cryptography.ECDsa]::Create()
          $ecdsa.ImportFromPem($env:UPDATE_SIGNING_KEY)
          $bytes = [IO.File]::ReadAllBytes((Resolve-Path 'Undertone-win-x64.zip'))
          $sig = $ecdsa.SignData($bytes, [System.Security.Cryptography.HashAlgorithmName]::SHA256)
          [Convert]::ToBase64String($sig) | Set-Content -Encoding ascii Undertone-win-x64.zip.sig

      - name: Установщик
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress | Out-Null
          }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" "/DSourceDir=$PWD\publish" "/O$PWD" installer\Undertone.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup упал' }

      - name: Заметки к релизу из CHANGELOG.md
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          $text = Get-Content CHANGELOG.md -Raw -Encoding UTF8
          $pattern = '(?ms)^## ' + [regex]::Escape($v) + '[ \t]*\r?$(.*?)(?=^## |\z)'
          $m = [regex]::Match($text, $pattern)
          $notes = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "Undertone $v" }
          $notes += "`n`n**Установка:** скачайте ``Undertone-Setup-$v.exe`` или распакуйте ``Undertone-win-x64.zip`` в свою папку. .NET ставить не нужно."
          Set-Content -Path release-notes.md -Value $notes -Encoding UTF8

      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            Undertone-win-x64.zip
            Undertone-win-x64.zip.sha256
            Undertone-win-x64.zip.sig
            Undertone-Setup-*.exe
          fail_on_unmatched_files: false
