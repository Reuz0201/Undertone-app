# Сборка и тесты на каждый push и pull request — ошибка всплывёт сразу, а не во время релиза
name: CI

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Сборка
        run: dotnet build Undertone/Undertone.csproj -c Release --nologo

      - name: Тесты
        run: dotnet test Undertone.Tests/Undertone.Tests.csproj -c Release --nologo --logger "console;verbosity=normal" --logger "trx;LogFileName=results.trx" --results-directory TestResults

      # упавшие тесты — отдельными ошибками в сводке (их видно без открытия полного лога)
      - name: Упавшие тесты
        if: failure()
        shell: pwsh
        run: |
          $trx = Get-ChildItem TestResults -Filter *.trx -Recurse | Select-Object -First 1
          if (-not $trx) { Write-Output '::error title=Тесты::Файл результатов не создан — тесты не запустились'; exit 0 }
          [xml]$x = Get-Content $trx.FullName -Raw
          foreach ($r in $x.TestRun.Results.UnitTestResult | Where-Object { $_.outcome -eq 'Failed' }) {
            $msg = "$($r.Output.ErrorInfo.Message) $($r.Output.ErrorInfo.StackTrace)" -replace '%','%25' -replace "`r",'' -replace "`n",'%0A'
            if ($msg.Length -gt 3000) { $msg = $msg.Substring(0, 3000) }
            Write-Output "::error title=$($r.testName)::$msg"
          }

      # пока не обязательная: показывает nullable-предупреждения, но не роняет сборку
      - name: Проверка nullable (информационно)
        continue-on-error: true
        run: dotnet build Undertone/Undertone.csproj -c Release --nologo --no-incremental -p:WarningsAsErrors=nullable
